<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pump360 Loader Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, Manrope, system-ui, sans-serif;
      color: #172033;
      background: #ffffff;
    }
    .loader-preview {
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .loader-mark {
      width: min(540px, 90vw);
      height: auto;
      filter: drop-shadow(0 18px 28px rgba(15,23,42,.10));
    }
    .loader-ring {
      fill: none;
      stroke: #e2e8f0;
      stroke-width: 5;
    }
    .loader-progress {
      fill: none;
      stroke: url(#pump360Gradient);
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 96 205;
      transform-origin: 150px 90px;
      animation: ring-spin 1.35s cubic-bezier(.55,.05,.35,.95) infinite;
    }
    .pump-body { animation: pump-breathe 1.6s ease-in-out infinite; transform-origin: 62px 92px; }
    .vehicle { animation: vehicle-idle 1.1s ease-in-out infinite; transform-origin: 205px 124px; }
    .wheel { animation: wheel-turn 1.4s linear infinite; transform-origin: center; transform-box: fill-box; }
    .fuel-flow { stroke-dasharray: 5 9; animation: fuel-flow .7s linear infinite; }
    .fuel-level { animation: tank-fill 2.2s ease-in-out infinite; transform-origin: left center; transform-box: fill-box; }
    .fuel-spark { animation: spark-pulse 1.1s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .loader-title {
      margin: 8px 0 5px;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -.35px;
    }
    .loader-title span { color: #f97316; }
    .loader-message {
      margin: 0;
      color: #667085;
      font-size: 15px;
      font-weight: 600;
    }
    .loader-dots { display: inline-flex; gap: 4px; margin-left: 3px; }
    .loader-dots i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #f97316;
      animation: dot-pulse 1.1s ease-in-out infinite;
    }
    .loader-dots i:nth-child(2) { animation-delay: .15s; }
    .loader-dots i:nth-child(3) { animation-delay: .3s; }
    .loading-track {
      position: relative;
      width: min(330px, 72vw);
      height: 5px;
      margin: 18px auto 15px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9edf2;
    }
    .loading-track::after {
      content: "";
      position: absolute;
      inset: 0;
      width: 42%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f97316, #fb923c, #0e8fa6);
      animation: loading-slide 1.35s cubic-bezier(.65,0,.35,1) infinite;
      box-shadow: 0 0 14px rgba(249,115,22,.28);
    }
    .station-glow { animation: station-glow 1.8s ease-in-out infinite; }
    .price-digit { animation: digit-pulse 1.2s steps(2) infinite; }
    .fuel-drop { animation: drop-pulse 1.2s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .fuel-drop:nth-child(2) { animation-delay: .25s; }
    .fuel-drop:nth-child(3) { animation-delay: .5s; }
    .road-line { stroke-dasharray: 34 20; animation: road-move .9s linear infinite; }
    .status-pill { animation: status-pulse 1.5s ease-in-out infinite; }
    .management-chip { animation: chip-float 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .management-chip:nth-of-type(2) { animation-delay: .35s; }
    .management-chip:nth-of-type(3) { animation-delay: .7s; }
    .data-pulse { animation: data-pulse 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .chart-bar { animation: chart-grow 1.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .chart-bar:nth-child(2) { animation-delay: .18s; }
    .chart-bar:nth-child(3) { animation-delay: .36s; }
    .chart-bar:nth-child(4) { animation-delay: .54s; }
    .tank-liquid { animation: tank-level 2.4s ease-in-out infinite; }
    @keyframes ring-spin { to { transform: rotate(360deg); } }
    @keyframes pump-breathe { 50% { transform: scale(.94); opacity: .82; } }
    @keyframes vehicle-idle { 50% { transform: translateY(-2px); } }
    @keyframes wheel-turn { to { transform: rotate(360deg); } }
    @keyframes fuel-flow { to { stroke-dashoffset: -28; } }
    @keyframes tank-fill { 0%,100% { transform: scaleX(.22); } 55%,75% { transform: scaleX(1); } }
    @keyframes spark-pulse { 50% { transform: scale(1.35); opacity: .45; } }
    @keyframes dot-pulse { 0%,60%,100% { transform: translateY(0); opacity: .35; } 30% { transform: translateY(-4px); opacity: 1; } }
    @keyframes station-glow { 50% { opacity: .42; transform: scale(1.04); } }
    @keyframes digit-pulse { 50% { opacity: .55; } }
    @keyframes drop-pulse { 50% { transform: translateY(5px) scale(.7); opacity: .25; } }
    @keyframes road-move { to { stroke-dashoffset: -54; } }
    @keyframes status-pulse { 50% { opacity: .62; } }
    @keyframes loading-slide { from { transform: translateX(-105%); } to { transform: translateX(245%); } }
    @keyframes chip-float { 50% { transform: translateY(-4px); } }
    @keyframes data-pulse { 50% { transform: scale(1.45); opacity: .45; } }
    @keyframes chart-grow { from { transform: scaleY(.45); } to { transform: scaleY(1); } }
    @keyframes tank-level { 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      .loader-progress, .pump-body, .vehicle, .wheel, .fuel-flow, .fuel-level, .fuel-spark, .loader-dots i, .loading-track::after { animation: none; }
    }
  </style>
</head>
